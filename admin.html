<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smile Coin Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}

header{
  background:#171717;
  padding:20px;
  text-align:center;
}

.logo{
  color:#ff9d00;
  font-size:26px;
  font-weight:bold;
}

.container{
  padding:20px;
}

h2{
  color:#ff9d00;
}

.order{
  background:#202020;
  border-radius:14px;
  padding:18px;
  margin:15px 0;
  border:1px solid #333;
}

.order p{
  margin:8px 0;
}

.status{
  color:#ffb52e;
  font-weight:bold;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  margin:5px;
  font-weight:bold;
  cursor:pointer;
}

.complete{
  background:#39b54a;
  color:white;
}

.cancel{
  background:#d9534f;
  color:white;
}

.refresh{
  background:#ff9d00;
  color:#111;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px;
}
</style>
</head>

<body>

<header>
<div class="logo">🪙 SMILE COIN ADMIN</div>
</header>

<div class="container">

<h2>📋 Customer Orders</h2>

<button class="refresh" onclick="loadOrders()">
🔄 Refresh Orders
</button>

<div id="orders">
<div class="empty">Loading orders...</div>
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyBhiChmKdTrsdzu5JHNeAi-0QuWQlLZvY",

authDomain:
"smile-coin-81c3b.firebaseapp.com",

projectId:
"smile-coin-81c3b",

storageBucket:
"smile-coin-81c3b.firebasestorage.app",

messagingSenderId:
"627444858511",

appId:
"1:627444858511:web:4c1f5cbe802886f7cabafa"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


window.loadOrders = async function(){

const box =
document.getElementById("orders");

box.innerHTML =
'<div class="empty">Loading...</div>';

try{

const snapshot =
await getDocs(
collection(db,"orders")
);

if(snapshot.empty){

box.innerHTML =
'<div class="empty">No orders yet.</div>';

return;

}

box.innerHTML = "";

snapshot.forEach((item)=>{

const data = item.data();

const order =
document.createElement("div");

order.className = "order";

order.innerHTML = `

<p>
🧾 <b>Order ID:</b>
${data.orderId || item.id}
</p>

<p>
🎮 <b>Game:</b>
${data.game || "-"}
</p>

<p>
🆔 <b>Player ID:</b>
${data.playerId || "-"}
</p>

<p>
🌐 <b>Server ID:</b>
${data.serverId || "-"}
</p>

<p>
📦 <b>Package:</b>
${data.package || "-"}
</p>

<p>
💰 <b>Total:</b>
${data.price || 0}
${data.currency || ""}
</p>

<p class="status">
⏳ Status:
${data.status || "pending"}
</p>

<button
class="complete"
onclick="changeStatus('${item.id}','completed')">
✅ COMPLETED
</button>

<button
class="cancel"
onclick="changeStatus('${item.id}','cancelled')">
❌ CANCEL
</button>

`;

box.appendChild(order);

});

}catch(error){

console.error(error);

box.innerHTML =
'<div class="empty">❌ Error loading orders: '
+ error.message +
'</div>';

}

};


window.changeStatus = async function(
orderId,
status
){

try{

await updateDoc(
doc(db,"orders",orderId),
{
status:status
}
);

alert(
"Order status updated: " + status
);

loadOrders();

}catch(error){

console.error(error);

alert(
"Status update failed: " +
error.message
);

}

};


loadOrders();

</script>

</body>
</html>
