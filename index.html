<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smile Coin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}

header{
  background:#171717;
  padding:20px;
  text-align:center;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#ff9d00;
}

.hero{
  padding:40px 20px;
  text-align:center;
  background:linear-gradient(135deg,#251400,#111);
}

.hero h1{
  font-size:38px;
}

.hero p{
  color:#ccc;
}

button{
  background:#ff9d00;
  color:#111;
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-weight:bold;
  cursor:pointer;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:20px;
}

.card{
  background:#202020;
  border-radius:15px;
  padding:25px 10px;
  text-align:center;
}

.card p{
  color:#ccc;
}

.form{
  display:none;
  margin:20px;
  padding:22px;
  background:#202020;
  border-radius:15px;
}

.form h2{
  color:#ff9d00;
}

label{
  display:block;
  margin-top:12px;
}

input,select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #444;
  background:#111;
  color:white;
}

.total{
  margin:18px 0;
  color:#ffb52e;
  font-size:20px;
  font-weight:bold;
}

#message{
  margin:20px;
  padding:15px;
  background:#172617;
  border:1px solid #39b54a;
  border-radius:10px;
  display:none;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">🪙 SMILE COIN</div>
</header>

<section class="hero">
  <h1>Smile Coin</h1>
  <p>Game Top-up Service</p>
</section>

<div class="cards">

<div class="card">
  <h2>🎮 PUBG Mobile</h2>
  <p>UC Top-up</p>
  <button onclick="openForm('PUBG')">TOP UP</button>
</div>

<div class="card">
  <h2>💎 Mobile Legends</h2>
  <p>Diamonds</p>
  <button onclick="openForm('MLBB')">TOP UP</button>
</div>

</div>

<div class="form" id="form">

<h2 id="gameTitle">Game Top-up</h2>

<label>Player ID / User ID</label>
<input id="playerId" placeholder="Enter Player ID">

<label id="serverLabel">Server / Zone ID</label>
<input id="serverId" placeholder="Enter Server ID">

<label>Package</label>

<select id="package">
<option value="50">50 - 50 THB</option>
<option value="100">100 - 100 THB</option>
<option value="300">300 - 250 THB</option>
<option value="500">500 - 400 THB</option>
<option value="1000">1000 - 750 THB</option>
</select>

<label>Currency</label>

<select id="currency" onchange="calculate()">
<option value="THB">🇹🇭 THB</option>
<option value="MMK">🇲🇲 MMK</option>
</select>

<div class="total" id="total">
Total: 50 THB
</div>

<button onclick="placeOrder()">🛒 PLACE ORDER</button>

</div>

<div id="message"></div>

<footer>
© 2026 Smile Coin
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBhiChmKdTrsdzu5JHNeAi-0-QuWQlLZvY",

  authDomain:
  "smile-coin-81c3b.firebaseapp.com",

  projectId:
  "smile-coin-81c3b",

  storageBucket:
  "smile-coin-81c3b.firebasestorage.app",

  messagingSenderId:
  "627444858511",

  appId:
  "1:627444858511:web:4c1f5cbe802886f7cabafa",

  measurementId:
  "G-JQTM6WVND3"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


let currentGame = "PUBG";


window.openForm = function(game){

  currentGame = game;

  document.getElementById("form").style.display="block";

  if(game === "PUBG"){

    document.getElementById("gameTitle").innerText =
    "🎮 PUBG Mobile UC";

    document.getElementById("serverLabel").style.display="none";

    document.getElementById("serverId").style.display="none";

  }else{

    document.getElementById("gameTitle").innerText =
    "💎 Mobile Legends Diamonds";

    document.getElementById("serverLabel").style.display="block";

    document.getElementById("serverId").style.display="block";
  }

  document.getElementById("form")
  .scrollIntoView({behavior:"smooth"});

};


window.calculate = function(){

  let price =
  Number(document.getElementById("package").value);

  let currency =
  document.getElementById("currency").value;

  if(currency === "MMK"){
    price = price * 100;
  }

  document.getElementById("total").innerText =
  "Total: " +
  price.toLocaleString() +
  " " +
  currency;

};


window.placeOrder = async function(){

  const playerId =
  document.getElementById("playerId").value.trim();

  const serverId =
  document.getElementById("serverId").value.trim();

  const pack =
  document.getElementById("package").value;

  const currency =
  document.getElementById("currency").value;


  if(!playerId){

    alert("Player ID ထည့်ပေးပါ။");

    return;
  }


  if(currentGame === "MLBB" && !serverId){

    alert("Server ID ထည့်ပေးပါ။");

    return;
  }


  let price = Number(pack);

  if(currency === "MMK"){
    price = price * 100;
  }


  try{

    const orderRef =
    await addDoc(
      collection(db,"orders"),
      {

        game: currentGame,

        playerId: playerId,

        serverId:
        currentGame === "MLBB"
        ? serverId
        : "",

        package: pack,

        currency: currency,

        price: price,

        status: "pending",

        createdAt:
        serverTimestamp()
      }
    );


    document.getElementById("message").style.display="block";

    document.getElementById("message").innerHTML =
    "✅ Order တင်ပြီးပါပြီ။<br><br>" +
    "Order ID: <b>" +
    orderRef.id +
    "</b><br>" +
    "Status: Pending";


  }catch(error){

    alert(
      "Order မတင်နိုင်သေးပါ။ Firebase Rules ကို စစ်ပေးပါ။"
    );

    console.log(error);

  }

};

</script>

</body>
  </html>
